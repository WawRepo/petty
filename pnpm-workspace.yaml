packages:
  - apps/*
  - packages/*
  - tests/*
allowBuilds:
  '@clerk/shared': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  utf-8-validate: false

# PETTY-312: install only the peers a package.json asks for. With pnpm's default (true), react-i18next's
# optional peer react-native came in with its whole toolchain (126 packages: metro, a bundler, and its
# braces, GHSA-vfj7-8cjw-p6xm) for a web app that never imports it. Every peer Petty uses is a declared
# dependency; `pnpm peers check` lists any that is missing.
autoInstallPeers: false
