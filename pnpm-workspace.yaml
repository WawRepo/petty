packages:
  - apps/*
  - packages/*
  - tests/*
allowBuilds:
  '@clerk/shared': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  sharp: true
  utf-8-validate: false

# PETTY-312: install only the peers a package.json asks for. With pnpm's default (true), react-i18next's
# optional peer react-native came in with its whole toolchain (126 packages: metro, a bundler, and its
# braces, GHSA-vfj7-8cjw-p6xm) for a web app that never imports it. Every peer Petty uses is a declared
# dependency; `pnpm peers check` lists any that is missing.
autoInstallPeers: false

# PETTY-430: glob up to 14.0.1 (GHSA-3g3m-2fjr-6pw4) and minimatch below 11.0.1 (GHSA-g3hv-75wg-m249)
# have DoS fixes only in the next major. These four packages still ask for the old major. Each call
# they make works the same in glob 14 and minimatch 11 (checked 2026-11-19). Remove an entry when its
# package asks for the new major itself.
overrides:
  # In the image. node-pg-migrate calls glob only for --use-glob, which Petty does not use.
  node-pg-migrate>glob: ^14.0.2
  # Web build: globSync(pattern, { cwd, follow, ignore }) lists the offline cache files.
  workbox-build>glob: ^14.0.2
  # Lint: minimatch(path, pattern, { dot: true }) for allowDefaultProject.
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
  # Only the ejs command-line program (through jake) loads filelist; the build never does.
  filelist>minimatch: ^11.0.1
