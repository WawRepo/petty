# Petty in production with Docker Compose (PETTY-160).
#
#   cp deploy/compose/.env.example deploy/compose/.env    # then fill in every value
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d
#
# The app listens on 127.0.0.1:3000 over plain HTTP. Put a TLS reverse proxy (Caddy, Traefik,
# nginx) in front of it: Petty needs HTTPS for passkeys, cookies and the service worker.
#
# PETTY-190 (review NR-10): only the one-shot `migrate` service holds the database owner password.
# The app gets the two runtime roles, so rule 8 (entries are append-only for the API) holds here
# too. Images are pinned by digest; bump the tag AND the digest together.
# This file has no backup service: see docs/deploy.md, "Backups".
name: petty
services:
  db:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: petty
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
      POSTGRES_DB: petty
      PETTY_API_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD}
      PETTY_MAINT_PASSWORD: ${MAINT_DB_PASSWORD:?set MAINT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petty -d petty"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: ${PETTY_IMAGE:?set PETTY_IMAGE to ghcr.io/wawrepo/petty:<tag>@sha256:<digest>}
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://petty:${OWNER_DB_PASSWORD}@db:5432/petty
    command: ["pnpm", "migrate"]

  app:
    image: ${PETTY_IMAGE:?set PETTY_IMAGE to ghcr.io/wawrepo/petty:<tag>@sha256:<digest>}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_DATABASE_URL: postgres://petty_api:${API_DB_PASSWORD}@db:5432/petty
      MAINT_DATABASE_URL: postgres://petty_maint:${MAINT_DB_PASSWORD}@db:5432/petty
      APP_URL: ${APP_URL:?set APP_URL}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # A mounted folder with your own privacy notice and terms (docs/deploy.md); empty = none.
      LEGAL_DIR: ${LEGAL_DIR:-}
      # The image sets SECURE_COOKIES=true: keep the HTTPS reverse proxy. TRUST_PROXY = the proxies
      # whose X-Forwarded-For the app believes; the default is those on private networks (docs/deploy.md).
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      # A platform proxy's own client-address header (Fly-Client-IP, CF-Connecting-IP); empty = none.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # API requests per client address per minute; 0 = off (docs/deploy.md).
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      METRICS_PORT: ${METRICS_PORT:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      # Local mode only: "true" lets anyone create an account without a join link (a public instance).
      # Default = invite-only; the first account is minted with the join-link script (docs/deploy.md).
      OPEN_SIGNUP: ${OPEN_SIGNUP:-}
      # Per-person storage limit in MB (photos, documents, entries in the drawers they own). Empty = no limit.
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-}
      # Telemetry (docs/monitoring.md): traces always push to the OTLP endpoint when set;
      # OTEL_PUSH=true also pushes metrics + logs; DEPLOYMENT_ENV tags every signal.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_PUSH: ${OTEL_PUSH:-}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_FRONTEND_API: ${CLERK_FRONTEND_API:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
