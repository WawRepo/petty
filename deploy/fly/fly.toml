# Fly.io config for the public hosted Petty (PETTY-90). The app is one image: the API serves the
# built web app and the routes under /api. Postgres is Neon (managed, external) — not on Fly.
# Deploy with:  flyctl deploy --config deploy/fly/fly.toml
# or deploy a released image:  flyctl deploy --config deploy/fly/fly.toml --image ghcr.io/wawrepo/petty:vX.Y.Z@sha256:...
app = "petty"
primary_region = "waw"   # Warsaw; pick the region nearest your users and your Neon project

[build]
  dockerfile = "../../Dockerfile"

# Run database migrations (as the owner role, DATABASE_URL) before the new version takes traffic.
[deploy]
  release_command = "pnpm --filter @petty/api migrate"

# Non-secret settings. Secrets (DB URLs, Clerk keys, SMTP) are set with `flyctl secrets set` — see README.
[env]
  API_HOST = "0.0.0.0"
  API_PORT = "3000"
  API_PREFIX = "/api"
  WEB_DIST = "/app/apps/web/dist"
  SECURE_COOKIES = "true"
  TRUST_PROXY = "true"        # Fly's proxy sets X-Forwarded-For; the account lock is email-keyed (PETTY-201)
  AUTH_PROVIDER = "clerk"
  LOG_LEVEL = "info"
  METRICS_PORT = "0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # always on: sessions and the unlock cache live in the running process
  auto_start_machines = true
  min_machines_running = 1     # raise to 2 for HA once there are paying users
  [[http_service.checks]]
    method = "GET"
    path = "/api/health/live"
    interval = "10s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"             # Argon2id on unlock is memory-hungry; do not go below 512 MB
