version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze fail unless they run the same version
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/compose"
      - "/deploy/backup"
      - "/tests/integration"
    schedule:
      interval: weekly
