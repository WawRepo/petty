version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # PETTY-389: propose only versions at least 7 days old, so the twice-daily timer never ships a release
    # that is hours old. Security updates do not wait (GitHub). pnpm keeps its own 1-day minimumReleaseAge:
    # at 7 days it also rejects lockfile entries, so a fresh security fix would fail to install.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # PETTY-401: OpenTelemetry's packages move as one (a single SDK line in the process), majors and
      # 0.x jumps included, so a jump there neither splits over several PRs nor holds back the group below.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze fail unless they run the same version
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/compose"
      - "/deploy/backup"
      - "/tests/integration"
    # PETTY-380: daily, so a base image's security release reaches a pull request within a day.
    schedule:
      interval: daily
