name: backup-image
# PETTY-365: the backup job's image (deploy/backup/Dockerfile: pg_dump and age on Alpine), as
# ghcr.io/wawrepo/petty-backup:1. It was built by hand, so a Dockerfile bump never reached the image
# and its age kept an old Go toolchain with known CVEs. Now it is rebuilt:
# - when deploy/backup changes on main (Dependabot bumps the Alpine pin weekly);
# - on the 1st of every month, for Alpine's own fixes to postgresql16-client and age;
# - by hand: `gh workflow run backup-image.yml --ref main`.
# Pin it by digest: a rebuild moves the tag `1`, and a pinned backup job runs the old image until its
# operator moves the pin.
on:
  push:
    branches: [main]
    paths:
      - deploy/backup/**
      - .github/workflows/backup-image.yml
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # the image on GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same settings as release.yml's image (PETTY-297): minimal provenance, no build record, no summary.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          provenance: mode=min
          sbom: true
          tags: ghcr.io/wawrepo/petty-backup:1
      # Allowed: noreply addresses, the repository's SSH address and GitHub's address in Dependabot's
      # sign-off line (`support@github.com`; JSON escapes its `<` as `u003c`), none of them a person (PETTY-394).
      - name: The provenance holds no personal address
        env:
          IMAGE: ghcr.io/wawrepo/petty-backup:1@${{ steps.build.outputs.digest }}
        run: |
          hits=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' \
            | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            | grep -vc -e 'noreply' -e '^git@github\.com$' -e '^\(u003c\)\{0,1\}support@github\.com$' || true)
          if [ "$hits" != "0" ]; then
            echo "::error::the image's provenance holds $hits email address(es) that are not noreply ones. Delete this image version and turn on 'Keep my email addresses private' in GitHub."
            exit 1
          fi
      - name: What the image holds
        env:
          IMAGE: ghcr.io/wawrepo/petty-backup:1@${{ steps.build.outputs.digest }}
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          # Each platform by its own manifest: Docker refuses a second platform under one pulled digest.
          for arch in amd64 arm64; do
            d=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
            docker run --rm --platform "linux/$arch" "ghcr.io/wawrepo/petty-backup@$d" \
              sh -c "echo \"linux/$arch: age \$(age --version), \$(pg_dump --version)\""
          done
