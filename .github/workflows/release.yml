name: release
# On a v* tag: build the multi-arch image in CI (reproducible, with provenance and an SBOM),
# push it to GHCR, and publish a GitHub Release naming the image digest.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # PETTY-228: a tag becomes a release only if ci.yml's `test` and `integration` passed for this exact
  # commit. Reuses that result instead of re-running the suite; polls because both workflows start
  # from the same push. A tag on a commit that never went through CI can therefore not be released.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require ci.yml test + integration to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            json=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100")
            t=$(echo "$json" | jq -r '[.check_runs[] | select(.name=="test")]        | (.[0].conclusion // "pending")')
            n=$(echo "$json" | jq -r '[.check_runs[] | select(.name=="integration")] | (.[0].conclusion // "pending")')
            echo "attempt $i: test=$t integration=$n"
            if [ "$t" = "success" ] && [ "$n" = "success" ]; then exit 0; fi
            case "$t $n" in *failure*|*cancelled*|*timed_out*|*action_required*) echo "::error::CI did not pass for ${{ github.sha }} — refusing to release"; exit 1;; esac
            sleep 60
          done
          echo "::error::CI did not complete within 40 minutes for ${{ github.sha }}"; exit 1
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            PETTY_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/wawrepo/petty:${{ github.ref_name }}
            ghcr.io/wawrepo/petty:latest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Image: \`ghcr.io/wawrepo/petty:${{ github.ref_name }}@${{ steps.build.outputs.digest }}\` (linux/amd64, linux/arm64). See CHANGELOG.md." \
            --verify-tag
