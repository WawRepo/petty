name: release
# PETTY-254: a release is started by hand (Actions → release → Run workflow, or
# `gh workflow run release.yml --ref main`) and never waits for CI. It releases main as it is:
# - refused while ci.yml runs on main, or when ci.yml's latest run there did not pass on main's newest commit;
# - the version is the highest vX.Y.Z tag plus one patch. A tag pushed by hand (say v1.6.0) releases
#   nothing: it starts a new minor or major, and the next release is v1.6.1;
# - it makes the release commit (the version in every package.json and the add-on manifest; CHANGELOG.md's
#   [Unreleased] becomes the version's section), builds the linux/amd64 image (with provenance
#   and an SBOM), pushes the commit and its tag to main together, and publishes the GitHub Release: that
#   CHANGELOG section, the image digest and the add-on files;
# - then lists the add-on in the MCP Registry (mcp-registry.yml, PETTY-311).
# github-actions[bot] pushes the commit: if main ever gets a push rule, let GitHub Actions bypass it.
#
# PETTY-406 (security review, finding 8): no job that runs dependency code holds a write token. Any step
# can read its job's token from the runner, so the rights are split by job:
# - prepare (read only): the checks, the version, the release commit and its tag. Node and git only, no
#   dependencies. The commit and its tag travel to the other jobs as a git bundle; each job checks the
#   bundle against the ids that prepare printed, so nothing can swap the commit on the way.
# - pack (read only): installs the dependencies and packs the add-on and the command line.
# - image (packages: write): builds and pushes the image. The build's own steps run inside BuildKit,
#   which sees neither the token nor the registry login.
# - publish (contents: write, packages: write): pushes the commit and its tag, publishes the GitHub
#   Release and moves `latest`. It runs no dependency code.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
      tag: ${{ steps.commit.outputs.tag }}
    permissions:
      actions: read     # ci.yml's runs on main
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false } # every tag, to count the version from
      - name: Refuse unless ci.yml passed on main's newest commit and is not running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || fail "A release runs from main, not $GITHUB_REF."
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$tip" = "$GITHUB_SHA" ] || fail "main moved after this run started ($GITHUB_SHA, now $tip). Start the release again."
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --limit 20 \
            --json status,conclusion,headSha,url)
          [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")" = 0 ] \
            || fail "ci.yml is running on main. Start the release when it has finished."
          last=$(jq -c '.[0] // {}' <<< "$runs")
          result=$(jq -r '.conclusion // "no run"' <<< "$last")
          sha=$(jq -r '.headSha // ""' <<< "$last")
          url=$(jq -r '.url // ""' <<< "$last")
          [ "$result" = success ] || fail "ci.yml's latest run on main did not pass ($result): $url"
          released=$(git tag --points-at HEAD 'v*' | head -n 1)
          [ "$sha" = "$GITHUB_SHA" ] \
            || fail "${released:+main is already released as $released, so there is nothing new. }ci.yml's latest run on main is for $sha, not main's newest commit $GITHUB_SHA."
          echo "ci.yml passed on $GITHUB_SHA: $url"
      - name: Count the version (the highest vX.Y.Z tag plus one patch)
        id: version
        run: |
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          [ -n "$latest" ] || { echo "::error::No vX.Y.Z tag to count from."; exit 1; }
          next=$(awk -F. '{ print $1 "." $2 "." $3 + 1 }' <<< "${latest#v}")
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "The latest tag is $latest, so this release is v$next."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      # scripts/release.ts uses Node's own modules only: nothing from node_modules runs in this job.
      - name: Make the release commit and its tag (pushed only once the image is built)
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          node scripts/release.ts "$VERSION" "$(date -u +%F)" "$RUNNER_TEMP/release/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -s -a -m "Release $VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git bundle create "$RUNNER_TEMP/release/release.bundle" "refs/tags/v$VERSION" "^$GITHUB_SHA"
          git bundle verify -q "$RUNNER_TEMP/release/release.bundle"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse "refs/tags/v$VERSION")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # The AI add-on as release files too (not only served by each running Petty), with its licence,
  # third-party notices and checksums. Built from the same release commit as the image.
  pack:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-commit, path: "${{ runner.temp }}/release" }
      - name: Check out the release commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch -q --no-tags "$RUNNER_TEMP/release/release.bundle" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          if [ "$(git rev-parse "refs/tags/v$VERSION")" != "$TAG" ] || [ "$(git rev-parse "v$VERSION^{commit}")" != "$COMMIT" ]; then
            echo "::error::the release commit in the artifact is not the one the prepare job made"; exit 1
          fi
          git checkout -q --detach "$COMMIT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 } # no cache: a release job neither reads nor writes one
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @petty/mcp run pack
      # PETTY-274: the command line, one file, from the same release commit
      - run: pnpm --filter @petty/cli run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: apps/web/public/downloads/
          if-no-files-found: error
          retention-days: 7

  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write   # the image on GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-commit, path: "${{ runner.temp }}/release" }
      - name: Check out the release commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch -q --no-tags "$RUNNER_TEMP/release/release.bundle" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          if [ "$(git rev-parse "refs/tags/v$VERSION")" != "$TAG" ] || [ "$(git rev-parse "v$VERSION^{commit}")" != "$COMMIT" ]; then
            echo "::error::the release commit in the artifact is not the one the prepare job made"; exit 1
          fi
          git checkout -q --detach "$COMMIT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Right before the build that pushes. The Dockerfile's steps run inside BuildKit, which never sees it.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built from the release commit. `latest` moves only once the release is out (the last step).
      # PETTY-297 (review B2): v1.3.0–v1.5.0 carried the owner's email in their provenance (the event
      # payload's pusher and owner), and the build records uploaded as artifacts held it too. Minimal
      # provenance, no build record, no summary, no provenance in the logged metadata.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          context: .
          # PETTY-385: amd64 only, so no QEMU; `make image` still builds arm64 too for an ARM board
          platforms: linux/amd64
          push: true
          provenance: mode=min
          sbom: true
          build-args: |
            PETTY_VERSION=v${{ needs.prepare.outputs.version }}
          tags: ghcr.io/wawrepo/petty:v${{ needs.prepare.outputs.version }}
      # Before anything else is published: the image's provenance may hold no email address but a noreply
      # one. On a hit, nothing more is published; the address is never printed (logs are public).
      # `git@github.com` is the repository's SSH address (the event's repository.ssh_url), not a person.
      # `support@github.com` is GitHub's address in Dependabot's sign-off line, not a person. jq decodes the
      # JSON first, so an escape such as \n or \u003c does not stick to an address (PETTY-394).
      - name: The provenance holds no personal address
        env:
          IMAGE: ghcr.io/wawrepo/petty:v${{ needs.prepare.outputs.version }}
        run: |
          prov=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' | jq -r '.. | strings')
          if [ -z "$prov" ]; then echo "::error::the image has no provenance to check"; exit 1; fi
          hits=$(printf '%s\n' "$prov" | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            | grep -vc -e 'noreply' -e '^git@github\.com$' -e '^support@github\.com$' || true)
          if [ "$hits" != "0" ]; then
            echo "::error::the image's provenance holds $hits email address(es) that are not noreply ones; nothing else was published. Delete this image version, turn on 'Keep my email addresses private' in GitHub, and start the release again."
            exit 1
          fi

  publish:
    needs: [prepare, pack, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the release commit, its tag and the GitHub Release
      packages: write   # `latest` on GHCR
    steps:
      # The only checkout that keeps its token: git pushes with it. No dependency code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with: { persist-credentials: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-commit, path: "${{ runner.temp }}/release" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: downloads, path: "${{ runner.temp }}/downloads" }
      # Both or neither: if main moved meanwhile, nothing is published; the next run builds the version again.
      - name: Push the release commit and its tag to main
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch -q --no-tags "$RUNNER_TEMP/release/release.bundle" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          if [ "$(git rev-parse "refs/tags/v$VERSION")" != "$TAG" ] || [ "$(git rev-parse "v$VERSION^{commit}")" != "$COMMIT" ]; then
            echo "::error::the release commit in the artifact is not the one the prepare job made"; exit 1
          fi
          git checkout -q --detach "$COMMIT"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION" \
            || { echo "::error::main moved during the release, so nothing was published. Start it again once ci.yml has passed."; exit 1; }
      - name: Publish the GitHub Release with the add-on files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        working-directory: ${{ runner.temp }}/downloads
        run: |
          sha256sum petty.mcpb petty-mcp.mjs petty-skill.zip petty.mjs > SHA256SUMS
          {
            cat "$RUNNER_TEMP/release/notes.md"
            # shellcheck disable=SC2016 # the backticks are Markdown
            printf '\n---\n\nImage: `%s` (linux/amd64). Claude Desktop add-on: `petty.mcpb`; other MCP apps: `petty-mcp.mjs`; the Claude skill: `petty-skill.zip` — see docs/agent.md. The command line: `petty.mjs` — see docs/cli.md. Checksums in `SHA256SUMS`.\n' \
              "ghcr.io/wawrepo/petty:v$VERSION@$DIGEST"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag \
            petty.mcpb petty-mcp.mjs petty-skill.zip petty.mjs LICENSE THIRD_PARTY_NOTICES.md SHA256SUMS
          echo "Released v$VERSION: \`ghcr.io/wawrepo/petty:v$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One source, so imagetools makes a carbon copy: `latest` gets the same digest, attestations included.
      - name: Point `latest` at this release
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: docker buildx imagetools create --tag ghcr.io/wawrepo/petty:latest "ghcr.io/wawrepo/petty@$DIGEST"

  # PETTY-311: a job of its own, with only the rights the registry login needs. The release is out by
  # now: if this job fails, run mcp-registry.yml by hand with the tag.
  registry:
    needs: [prepare, publish]
    permissions:
      contents: read    # the release's files
      id-token: write   # the registry login
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
