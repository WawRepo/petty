name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    # PETTY-255: as in ci.yml, the runs Dependabot starts are skipped while the repository is private.
    if: ${{ !(github.event.repository.private && github.triggering_actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions REPLACE the workflow-level set (unlisted scopes become none). Without
    # contents:read the checkout fails with "Repository not found" and no analysis ever runs.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
