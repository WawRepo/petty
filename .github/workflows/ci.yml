name: ci
on:
  push:
    branches: [main]
  pull_request:
# GitHub-hosted runners (PETTY-162): pull requests from forks never run on anyone's own hardware.
permissions:
  contents: read
# A newer run for the same branch or pull request cancels the older one: fast pushes, or several merges
# in a row, leave one run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Secret scan (PETTY-208). gitleaks-action is free for public repos; it needs a licence on
  # private ones, so this job stays dormant until the repo is public, then runs on every push/PR.
  secrets:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # DCO (PETTY-304): every commit of a pull request is signed off by its author (CONTRIBUTING.md).
  # Our own check instead of a third-party app; Dependabot signs off too (web sign-off is required).
  dco:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dco-check.ts "$BASE" "$HEAD"

  test:
    # PETTY-255: while the repository is private (paid minutes), the runs Dependabot starts are skipped;
    # its updates are checked here on main after the merge. A re-run started by a person still runs.
    if: ${{ !(github.event.repository.private && github.triggering_actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env: { POSTGRES_USER: petty, POSTGRES_PASSWORD: petty, POSTGRES_DB: petty }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petty" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # psql is preinstalled on the runner; the init script creates the petty_api / petty_maint roles.
      - run: psql postgres://petty:petty@localhost:5432/petty -f docker/postgres/init.sql
      - run: pnpm migrate
      - run: pnpm audit --prod --audit-level high   # only what ships blocks a PR (dev advisories → Dependabot)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm i18n:check
      - run: pnpm --filter @petty/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # The image as it ships, under deploy/compose, over real HTTP (tests/integration).
  integration:
    if: ${{ !(github.event.repository.private && github.triggering_actor == 'dependabot[bot]') }} # as test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sh tests/integration/run.sh
