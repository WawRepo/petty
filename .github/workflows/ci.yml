name: ci
on:
  push:
    branches: [main]
  pull_request:
# GitHub-hosted runners (PETTY-162): pull requests from forks never run on anyone's own hardware.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: petty, POSTGRES_PASSWORD: petty, POSTGRES_DB: petty }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U petty" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # psql is preinstalled on the runner; the init script creates the petty_api / petty_maint roles.
      - run: psql postgres://petty:petty@localhost:5432/petty -f docker/postgres/init.sql
      - run: pnpm migrate
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm i18n:check
      - run: pnpm --filter @petty/web exec playwright install --with-deps chromium
      - run: pnpm e2e
