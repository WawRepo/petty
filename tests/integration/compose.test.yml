# Layered on deploy/compose/docker-compose.yml by run.sh: the production file as shipped, plus a
# local mail catcher and a port that does not clash with `make dev`.
services:
  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "127.0.0.1:8425:8025"
  app:
    ports: !override
      - "127.0.0.1:3400:3000"
      - "127.0.0.1:3401:9464" # PETTY-266/267: 14-metrics reads the scrape port
    depends_on:
      mailpit: { condition: service_started }
    environment:
      LOGIN_LIMIT_PER_IP: "1000"
      OPEN_SIGNUP: "true"   # PETTY-215: exercise open signup (invite path still works)
      STORAGE_QUOTA_MB: "1" # PETTY-243: small enough that 05-storage fills an account
      CONTACT_EMAIL: "ops@petty.test" # PETTY-281: the mails that say "tell the person who runs your Petty" name them
      CLIENT_IP_HEADER: "x-test-client-ip" # PETTY-301: 08-proxy plays a platform proxy that sets its own header
      METRICS_PORT: "9464" # PETTY-266/267: the scrape port, for 14-metrics
      LEGAL_DIR: "/legal" # PETTY-342: the operator's own privacy notice and terms, for 18-legal
    volumes:
      # relative to the first compose file (deploy/compose), as run.sh layers them
      - ../../tests/integration/legal:/legal:ro
  # PETTY-334: a second instance of the same image on the same database, as the public instance runs
  # two machines; 16-two-instances sends one request to each.
  app2:
    extends: { file: ../../deploy/compose/docker-compose.yml, service: app }
    ports: !override
      - "127.0.0.1:3402:3000"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      LOGIN_LIMIT_PER_IP: "1000"
      OPEN_SIGNUP: "true"
