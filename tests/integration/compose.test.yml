# Layered on deploy/compose/docker-compose.yml by run.sh: the production file as shipped, plus a
# local mail catcher and a port that does not clash with `make dev`.
services:
  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "127.0.0.1:8425:8025"
  app:
    ports: !override
      - "127.0.0.1:3400:3000"
    depends_on:
      mailpit: { condition: service_started }
    environment:
      LOGIN_LIMIT_PER_IP: "1000"
      OPEN_SIGNUP: "true"   # PETTY-215: exercise open signup (invite path still works)
      STORAGE_QUOTA_MB: "1" # PETTY-243: small enough that 05-storage fills an account
